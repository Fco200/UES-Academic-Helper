<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | UES Helper</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --ues-guinda: #800000; --bg-main: #f4f7f6; }
        body { background: var(--bg-main); color: #333; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; }
        .sidebar { width: 280px; background: white; border-right: 1px solid #ddd; height: 100vh; position: fixed; padding: 30px 20px; z-index: 1000; }
        .main-content { margin-left: 280px; padding: 50px; }
        .nav-link-custom { color: #666; padding: 12px; border-radius: 12px; display: block; text-decoration: none; margin-bottom: 10px; font-weight: 600; }
        .nav-link-custom:hover { background: #f0f0f0; color: var(--ues-guinda); }
        .nav-link-custom.active { background: var(--ues-guinda); color: white; }
        .status-header { background: white; border-radius: 20px; padding: 20px; border: 1px solid #eee; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .card-note { background: white; border: 1px solid #eee; border-radius: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        .materia-header { padding: 15px 20px; background: #fafafa; border-bottom: 1px solid #eee; border-radius: 25px 25px 0 0; }
        .btn-ues { background: var(--ues-guinda); color: white; border: none; border-radius: 10px; font-weight: 700; padding: 8px 15px; }
        .task-row { padding: 12px; border-radius: 15px; background: #fff; margin-bottom: 10px; border: 1px solid #f0f0f0; color: #111; font-weight: 500; }
        @media (max-width: 768px) { .sidebar { display:none; } .main-content { margin-left: 0; padding: 20px; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="text-center mb-5"><h4 class="fw-bold text-dark">UES <span class="text-danger">HELPER</span></h4></div>
        <nav>
            <a href="/home.html" class="nav-link-custom"><i class="fas fa-home me-2"></i> Inicio</a>
            <a href="/dashboard.html" class="nav-link-custom active"><i class="fas fa-tasks me-2"></i> Tareas CRUD</a>
            <a href="/perfil.html" class="nav-link-custom"><i class="fas fa-user-circle me-2"></i> Mi Perfil</a>
            <a href="/seguridad.html" class="nav-link-custom"><i class="fas fa-shield-alt me-2"></i> Seguridad</a>
        </nav>
        <button onclick="cerrarSesion()" class="btn btn-outline-danger w-100 rounded-pill py-2 mt-5 fw-bold">SALIR</button>
    </div>

    <div class="main-content">
        <div class="status-header shadow-sm">
            <div>
                <span class="d-block small text-muted fw-bold text-uppercase">Mis Materias</span>
                <h5 class="m-0 fw-bold text-dark"><i class="fas fa-user-graduate text-danger me-2"></i> <span id="nombreAlumno">Estudiante</span></h5>
            </div>
            <div class="text-end">
                <span id="userBadge" class="badge bg-light text-dark border rounded-pill px-3 py-2"></span>
            </div>
        </div>

        <div class="card p-4 card-note mb-5 border-0">
            <label class="form-label small text-muted fw-bold mb-3">AÑADIR NUEVA ASIGNATURA</label>
            <div class="row g-3">
                <div class="col-md-9"><input type="text" id="nombreInput" class="form-control" placeholder="Ej: Inteligencia Artificial"></div>
                <div class="col-md-3"><button onclick="guardarNuevo()" class="btn btn-ues w-100 h-100">GUARDAR</button></div>
            </div>
        </div>

        <div id="contenedorPrincipal" class="row"></div>
    </div>

    <script>
        const userEmail = localStorage.getItem('userEmail');
        const userName = localStorage.getItem('userName');

        window.onload = async () => { 
            if (!userEmail) return window.location.href = '/index.html'; 
            document.getElementById('userBadge').innerText = userEmail;
            document.getElementById('nombreAlumno').innerText = userName || "Estudiante";
            await cargarTodo(); 
        };

        async function cargarTodo() {
            // Se envía el email en la URL para filtrar en el servidor
            const res = await fetch(`/obtener-materias/${encodeURIComponent(userEmail)}`);
            const materias = await res.json();
            const cont = document.getElementById('contenedorPrincipal'); 
            cont.innerHTML = '';

            if(materias.length === 0) {
                cont.innerHTML = '<div class="text-center col-12 py-5 text-muted">No tienes materias aún. ¡Agrega la primera!</div>';
            }

            materias.forEach(m => {
                const tareasHtml = (m.tareas || []).map(t => `
                    <div class="task-row d-flex align-items-center">
                        <input type="checkbox" class="form-check-input me-3" ${t.completada ? 'checked' : ''} disabled>
                        <span class="${t.completada ? 'text-decoration-line-through opacity-50' : ''} flex-grow-1 small text-dark">${t.descripcion}</span>
                        <span class="badge bg-light text-muted border mx-2">${t.fecha || ''}</span>
                    </div>
                `).join('') || '<p class="text-muted small text-center my-3">Sin tareas</p>';

                cont.innerHTML += `
                    <div class="col-lg-6 mb-4">
                        <div class="card card-note h-100 border-0 shadow-sm">
                            <div class="materia-header d-flex justify-content-between align-items-center">
                                <h6 class="fw-bold m-0 text-dark">${m.nombre}</h6>
                                <button onclick="borrarMateria('${m._id}')" class="btn btn-sm text-muted"><i class="fas fa-trash-alt"></i></button>
                            </div>
                            <div class="card-body">
                                <div class="tareas-container mb-4">${tareasHtml}</div>
                                <div class="input-group input-group-sm">
                                    <input type="text" id="t-${m._id}" class="form-control" placeholder="Nueva tarea...">
                                    <input type="date" id="f-${m._id}" class="form-control">
                                    <button onclick="agregarTarea('${m._id}')" class="btn btn-ues"><i class="fas fa-plus"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        async function guardarNuevo() { 
            const n = document.getElementById('nombreInput').value.trim(); 
            if(n){ 
                await fetch('/agregar-materia', {
                    method:'POST', 
                    headers:{'Content-Type':'application/json'}, 
                    body:JSON.stringify({email: userEmail, nombre: n}) 
                }); 
                document.getElementById('nombreInput').value=''; 
                cargarTodo();
            }
        }

        async function agregarTarea(id) { 
            const d=document.getElementById(`t-${id}`).value, f=document.getElementById(`f-${id}`).value; 
            if(d){ 
                await fetch('/agregar-tarea', {
                    method:'POST', 
                    headers:{'Content-Type':'application/json'}, 
                    body:JSON.stringify({materiaId:id, descripcion:d, fecha:f})
                }); 
                cargarTodo();
            }
        }

        async function borrarMateria(id) {
            if(confirm("¿Eliminar materia?")) {
                await fetch(`/borrar-materia/${id}`, { method: 'DELETE' });
                cargarTodo();
            }
        }

        function cerrarSesion() { localStorage.clear(); window.location.href = '/index.html'; }
    </script>
</body>
</html>
