<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | UES Helper</title>
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --ues-guinda: #800000; --bg-main: #f4f7f6; --text-color: #333; --card-bg: white; }
        [data-theme="dark"] { --bg-main: #121212; --text-color: #e0e0e0; --card-bg: #1e1e1e; }

        body { background: var(--bg-main); color: var(--text-color); font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s; }
        .sidebar { width: 280px; background: var(--card-bg); border-right: 1px solid #ddd; height: 100vh; position: fixed; padding: 30px 20px; z-index: 1000; }
        .main-content { margin-left: 280px; padding: 50px; }
        
        .nav-link-custom { color: var(--text-color); padding: 12px; border-radius: 12px; display: flex; align-items: center; text-decoration: none; margin-bottom: 10px; font-weight: 600; opacity: 0.8; }
        .nav-link-custom:hover { background: rgba(128,0,0,0.1); color: var(--ues-guinda); }
        .nav-link-custom.active { background: var(--ues-guinda); color: white; opacity: 1; }
        
        .card-note { background: var(--card-bg); border: none; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); color: var(--text-color); }
        .task-row { padding: 8px 12px; border-radius: 12px; background: rgba(0,0,0,0.03); margin-bottom: 8px; border: 1px solid rgba(0,0,0,0.05); transition: 0.2s; }
        .task-row:hover { background: rgba(0,0,0,0.06); }

        .btn-action { border: none; background: none; padding: 4px 8px; border-radius: 8px; transition: 0.2s; opacity: 0.6; }
        .btn-action:hover { opacity: 1; background: rgba(0,0,0,0.1); }
        .btn-edit { color: #0d6efd; }
        .btn-delete { color: #dc3545; }

        .search-container { position: relative; margin-bottom: 25px; }
        .search-container i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); opacity: 0.5; }
        .search-input { padding-left: 45px !important; border-radius: 15px !important; border: 1px solid #ddd !important; background: var(--card-bg) !important; color: var(--text-color) !important; }

        .theme-toggle { position: fixed; bottom: 20px; right: 20px; z-index: 1001; width: 50px; height: 50px; border-radius: 50%; border: none; background: var(--ues-guinda); color: white; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        @media (max-width: 768px) { .sidebar { display:none; } .main-content { margin-left: 0; padding: 20px; } }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i></button>

    <div class="sidebar">
        <div class="text-center mb-5"><h4 class="fw-bold">UES <span class="text-danger">HELPER</span></h4></div>
        <nav>
              <a href="/home.html" class="nav-btn active"><i class="fas fa-home"></i> <span class="nav-text">Inicio</span></a>
            <a href="/dashboard.html" class="nav-btn"><i class="fas fa-tasks"></i> <span class="nav-text">Tareas</span></a>
            <a href="/perfil.html" class="nav-btn"><i class="fas fa-user-circle"></i> <span class="nav-text">Mi Perfil</span></a>
            <a href="/noticia-usuario.html" class="nav-btn"><i class="fas fa-shield-alt"></i> <span class="nav-text">Noticias</span></a>
            <a href="/seguridad.html" class="nav-btn"><i class="fas fa-shield-alt"></i> <span class="nav-text">Cambiar Contraseña</span></a>
             <a href="/explorador U.html" class="nav-btn"><i class="fas fa-shield-alt"></i> <span class="nav-text">UNIVERSIDADES</span></a>
             <a href="/calendario.html" class="nav-btn"><i class="fas fa-shield-alt"></i> <span class="nav-text">calendario</span></a>
            <a href="/soporte.html" class="nav-btn"><i class="fas fa-shield-alt"></i> <span class="nav-text">Ayuda </span></a>

        </nav>
        <button onclick="cerrarSesion()" class="btn btn-outline-danger w-100 rounded-pill py-2 mt-5 fw-bold">SALIR</button>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-extrabold">Gestión Académica</h2>
            <span id="userBadge" class="badge bg-white text-dark border rounded-pill px-3 py-2 shadow-sm"></span>
        </div>

        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="buscadorInput" class="form-control search-input" placeholder="Buscar materia por nombre..." onkeyup="filtrarMaterias()">
        </div>

        <div class="card p-4 card-note mb-4">
            <label class="form-label small text-muted fw-bold mb-3">NUEVA ASIGNATURA</label>
            <div class="row g-3">
                <div class="col-md-9"><input type="text" id="nombreInput" class="form-control" placeholder="Nombre de la materia..."></div>
                <div class="col-md-3"><button onclick="guardarNuevo()" class="btn btn-danger w-100 py-2">AGREGAR</button></div>
            </div>
        </div>

        <div id="contenedorPrincipal" class="row"></div>
    </div>

    <script>
        let materiasLocales = [];
        const userEmail = localStorage.getItem('userEmail');

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            document.getElementById('themeIcon').className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        window.onload = async () => { 
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeIcon').className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';

            if (!userEmail) return window.location.href = '/index.html'; 
            document.getElementById('userBadge').innerText = userEmail;
            await cargarTodo(); 
        };

        async function cargarTodo() {
            const res = await fetch(`/obtener-materias/${encodeURIComponent(userEmail)}`);
            materiasLocales = await res.json();
            renderizarMaterias(materiasLocales);
        }

        function renderizarMaterias(lista) {
            const cont = document.getElementById('contenedorPrincipal'); 
            cont.innerHTML = '';

            lista.forEach(m => {
                const tareasHtml = (m.tareas || []).map(t => `
                    <div class="task-row d-flex align-items-center">
                        <input type="checkbox" class="form-check-input me-3" ${t.completada ? 'checked' : ''} 
                            onchange="completarTarea('${m._id}', '${t._id}', ${t.completada})">
                        <span class="${t.completada ? 'text-decoration-line-through opacity-50' : 'fw-bold'} flex-grow-1">${t.descripcion}</span>
                        <div class="ms-2">
                            <button class="btn-action btn-edit" onclick="editarTarea('${m._id}', '${t._id}', '${t.descripcion}')"><i class="fas fa-edit"></i></button>
                            <button class="btn-action btn-delete" onclick="eliminarTarea('${m._id}', '${t._id}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `).join('');

                cont.innerHTML += `
                    <div class="col-lg-6 mb-4 card-materia" data-nombre="${m.nombre.toLowerCase()}">
                        <div class="card card-note h-100 p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <h5 class="fw-bold mb-0">${m.nombre}</h5>
                                <div>
                                    <button class="btn-action btn-edit" onclick="editarMateria('${m._id}', '${m.nombre}')"><i class="fas fa-pen"></i></button>
                                    <button class="btn-action btn-delete" onclick="eliminarMateria('${m._id}')"><i class="fas fa-times-circle"></i></button>
                                </div>
                            </div>
                            <div class="mb-3">${tareasHtml}</div>
                            <div class="input-group">
                                <input type="text" id="t-${m._id}" class="form-control border-0 bg-light" placeholder="Escribir tarea...">
                                <button onclick="agregarTarea('${m._id}')" class="btn btn-danger"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        // --- CRUD MATERIAS ---
        async function guardarNuevo() {
            const nombre = document.getElementById('nombreInput').value;
            if(!nombre) return;
            await fetch('/agregar-materia', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: userEmail, nombre })
            });
            document.getElementById('nombreInput').value = '';
            cargarTodo();
        }

        async function editarMateria(id, nombreActual) {
            const nuevoNombre = prompt("Editar nombre de la materia:", nombreActual);
            if (!nuevoNombre || nuevoNombre === nombreActual) return;
            await fetch('/editar-materia', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ materiaId: id, nombre: nuevoNombre })
            });
            cargarTodo();
        }

        async function eliminarMateria(id) {
            if (!confirm("¿Eliminar esta materia y todas sus tareas?")) return;
            await fetch(`/eliminar-materia/${id}`, { method: 'DELETE' });
            cargarTodo();
        }

        // --- CRUD TAREAS ---
        async function agregarTarea(id) { 
            const d = document.getElementById(`t-${id}`).value;
            if(!d) return;
            await fetch('/agregar-tarea', {
                method:'POST', 
                headers:{'Content-Type':'application/json'}, 
                body:JSON.stringify({materiaId:id, descripcion:d})
            }); 
            cargarTodo();
        }

        async function completarTarea(mId, tId, estado) {
            await fetch('/completar-tarea', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({materiaId: mId, tareaId: tId, completada: !estado})
            });
            cargarTodo();
        }

        async function editarTarea(mId, tId, descActual) {
            const nuevaDesc = prompt("Editar tarea:", descActual);
            if (!nuevaDesc || nuevaDesc === descActual) return;
            await fetch('/editar-tarea', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ materiaId: mId, tareaId: tId, descripcion: nuevaDesc })
            });
            cargarTodo();
        }

        async function eliminarTarea(mId, tId) {
            if (!confirm("¿Eliminar esta tarea?")) return;
            await fetch('/eliminar-tarea', {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ materiaId: mId, tareaId: tId })
            });
            cargarTodo();
        }

        function filtrarMaterias() {
            const texto = document.getElementById('buscadorInput').value.toLowerCase();
            document.querySelectorAll('.card-materia').forEach(card => {
                card.style.display = card.getAttribute('data-nombre').includes(texto) ? 'block' : 'none';
            });
        }

        function cerrarSesion() { localStorage.clear(); window.location.href = '/index.html'; }
        document.addEventListener("DOMContentLoaded", function() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-btn');
        
        navLinks.forEach(link => {
            // Verifica si el href coincide con la ruta actual
            if (currentPath.includes(link.getAttribute('href'))) {
                link.classList.add('active');
            }
        });
    });
    </script>
</body>
</html>
