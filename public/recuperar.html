<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Acceso | UES Helper</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --ues-guinda: #800000; --bg: #f8f9fa; }
        body { 
            background: var(--bg);
            height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif; color: #333; margin: 0;
        }
        .recovery-card {
            background: white; border: 1px solid #eee;
            border-radius: 35px; padding: 45px; width: 100%; max-width: 450px;
            text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.06);
        }
        .form-control {
            background: #fdfdfd !important; border: 1px solid #ddd !important; 
            color: #111 !important; border-radius: 12px; padding: 15px;
            font-weight: 600;
        }
        .btn-ues { 
            background: var(--ues-guinda); color: white; border: none; padding: 16px; 
            border-radius: 15px; font-weight: 800; width: 100%; transition: 0.3s;
            margin-top: 15px; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-ues:hover { background: #a00000; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(128,0,0,0.2); }
        .text-dark-bold { color: #111; font-weight: 800; }
        
        /* Botón de ayuda rápida mejorado */
        .help-box {
            margin-top: 25px;
            padding: 20px;
            background: #f0fff4; /* Un tono verde muy suave */
            border-radius: 20px;
            border: 1px solid #dcfce7;
        }
        .btn-whatsapp-action {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none !important;
            font-weight: 700;
            font-size: 0.9rem;
            transition: 0.3s;
            width: 100%;
        }
        .btn-whatsapp-action:hover {
            background: #1eb956;
            transform: scale(1.02);
            color: white;
        }
    </style>
</head>
<body>

    <div class="recovery-card">
        <i class="fas fa-user-shield text-danger fa-3x mb-3"></i>
        <h2 class="text-dark-bold">Recuperar Acceso</h2>
        <p class="text-muted small mb-4">Si olvidaste tu clave, solicítala directamente al administrador por WhatsApp para recibirla en tu correo.</p>
        
        <div class="mb-4 text-start">
            <label class="small fw-bold text-muted mb-2">INGRESA TU CORREO REGISTRADO</label>
            <input type="email" id="emailRecuperar" class="form-control" placeholder="ejemplo@ues.mx">
        </div>

        <button onclick="solicitarPorWhatsapp()" class="btn-whatsapp-action">
            SOLICITAR POR WHATSAPP <i class="fab fa-whatsapp ms-2"></i>
        </button>

        <div class="help-box">
            <p class="text-muted small mb-0">Al hacer clic, se abrirá un chat con tu correo ya escrito para que nosotros podamos enviarte tu contraseña manualmente.</p>
        </div>

        <div class="mt-4 border-top pt-3">
            <a href="/index.html" class="text-danger fw-bold text-decoration-none small">
                <i class="fas fa-arrow-left me-1"></i> Volver al Inicio de Sesión
            </a>
        </div>
    </div>

    <script>
        function solicitarPorWhatsapp() {
            const email = document.getElementById('emailRecuperar').value.trim();
            const telefono = "526625374491"; // Tu número de soporte

            if(!email) {
                alert("⚠️ Por favor, escribe primero tu correo para poder ayudarte.");
                document.getElementById('emailRecuperar').focus();
                return;
            }

            // Validar que sea un correo válido (opcional pero recomendado)
            if(!email.includes("@")) {
                alert("❌ Por favor ingresa un correo electrónico válido.");
                return;
            }

            // Crear el mensaje personalizado
            const mensaje = encodeURIComponent(`Hola, necesito ayuda para recuperar mi cuenta de UES Helper.\nMi correo es: ${email}\nSolicito mi contraseña por correo, por favor.`);
            
            // Construir enlace de WhatsApp
            const url = `https://wa.me/${telefono}?text=${mensaje}`;
            
            // Abrir en una nueva pestaña
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
