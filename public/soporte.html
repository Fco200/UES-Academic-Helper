<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte | UES Helper</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --ues-guinda: #800000; --sidebar-w: 280px; }
        body { background: #f4f7f6; font-family: 'Plus Jakarta Sans', sans-serif; }
        .sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #ddd; height: 100vh; position: fixed; padding: 30px 20px; }
        .main-content { margin-left: var(--sidebar-w); padding: 50px; }
        .nav-link-custom { color: #666; padding: 12px; border-radius: 12px; display: block; text-decoration: none; margin-bottom: 10px; font-weight: 600; }
        .nav-link-custom:hover { background: #f0f0f0; color: var(--ues-guinda); }
        .nav-link-custom.active { background: var(--ues-guinda); color: white; }
        
        .support-card { background: white; border-radius: 25px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #eee; max-width: 700px; margin: auto; }
        .form-control, .form-select { background: #f9f9f9; border: 1px solid #eee; border-radius: 12px; padding: 12px; margin-bottom: 20px; }
        .form-control:focus { border-color: var(--ues-guinda); box-shadow: none; background: white; }
        @media (max-width: 768px) { .sidebar { display:none; } .main-content { margin-left: 0; padding: 20px; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="text-center mb-5"><h4 class="fw-bold text-dark">UES <span class="text-danger">HELPER</span></h4></div>
        <nav>
             <a href="/home.html" class="nav-btn active"><i class="fas fa-home"></i> <span class="nav-text">Inicio</span></a>
            <a href="/dashboard.html" class="nav-btn"><i class="fas fa-tasks"></i> <span class="nav-text">Tareas</span></a>
            <a href="/perfil.html" class="nav-btn"><i class="fas fa-user-circle"></i> <span class="nav-text">Mi Perfil</span></a>
            <a href="/noticia-usuario.html" class="nav-btn"><i class="fas fa-shield-alt"></i> <span class="nav-text">Noticias</span></a>
            <a href="/seguridad.html" class="nav-btn"><i class="fas fa-shield-alt"></i> <span class="nav-text">Cambiar Contraseña</span></a>
             <a href="/explorador U.html" class="nav-btn"><i class="fas fa-shield-alt"></i> <span class="nav-text">UNIVERSIDADES</span></a>
             <a href="/calendario.html" class="nav-btn"><i class="fas fa-shield-alt"></i> <span class="nav-text">calendario</span></a>
            <a href="/soporte.html" class="nav-btn"><i class="fas fa-shield-alt"></i> <span class="nav-text">Ayuda </span></a>

        </nav>
    </div>

    <div class="main-content">
        <div class="support-card">
            <div class="text-center mb-4">
                <i class="fas fa-headset text-danger mb-3" style="font-size: 3rem;"></i>
                <h3 class="fw-bold">Centro de Ayuda</h3>
                <p class="text-muted">¿Tienes algún problema o sugerencia? Cuéntanos.</p>
            </div>

            <form id="supportForm">
                <div class="row">
                    <div class="col-md-6">
                        <label class="small fw-bold text-muted mb-2">TU NOMBRE</label>
                        <input type="text" id="supNombre" class="form-control" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="small fw-bold text-muted mb-2">TU CORREO</label>
                        <input type="email" id="supEmail" class="form-control" readonly>
                    </div>
                </div>

                <label class="small fw-bold text-muted mb-2">¿EN QUÉ PODEMOS AYUDARTE?</label>
                <select id="supAsunto" class="form-select" required>
                    <option value="" selected disabled>Selecciona una opción</option>
                    <option value="Error en la App">Reportar un error técnico</option>
                    <option value="Sugerencia">Enviar una sugerencia</option>
                    <option value="Duda de Materias">Duda sobre mis materias</option>
                    <option value="Otro">Otro asunto</option>
                </select>

                <label class="small fw-bold text-muted mb-2">MENSAJE DETALLADO</label>
                <textarea id="supMensaje" class="form-control" rows="5" placeholder="Describe tu situación aquí..." required></textarea>

                <button type="submit" class="btn btn-danger w-100 py-3 rounded-4 fw-bold shadow-sm mt-2">
                    ENVIAR MENSAJE
                </button>
            </form>
            <div id="responseMsg" class="mt-3 text-center"></div>
        </div>
    </div>

    <script>
        const userEmail = localStorage.getItem('userEmail');
        const userName = localStorage.getItem('userName');

        window.onload = () => {
            if (!userEmail) window.location.href = '/index.html';
            document.getElementById('supNombre').value = userName || "Estudiante";
            document.getElementById('supEmail').value = userEmail;
        };

        document.getElementById('supportForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerText = "Enviando...";

            const datos = {
                email: userEmail,
                nombre: userName,
                asunto: document.getElementById('supAsunto').value,
                mensaje: document.getElementById('supMensaje').value
            };

            try {
                const res = await fetch('/enviar-soporte', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('responseMsg').innerHTML = `<span class="text-success fw-bold"><i class="fas fa-check-circle"></i> ¡Mensaje enviado! Te contactaremos pronto.</span>`;
                    document.getElementById('supMensaje').value = "";
                }
            } catch (err) {
                document.getElementById('responseMsg').innerHTML = `<span class="text-danger fw-bold">Error al conectar con el servidor.</span>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "ENVIAR MENSAJE";
            }
        };
    </script>
</body>
</html>
